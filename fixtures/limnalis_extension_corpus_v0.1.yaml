    - id: q_amplify
      claimId: c_coherent
      bridgeId: b_amplify
  normalized_ast_expectations:
  - 'c_super: the panel splits live (unitary_v1 -> T, collapse_v1 -> F) ->
    aggregate B[evaluator_conflict] with support conflicted under
    paraconsistent_union'
  - 'block(local) folds PER EVALUATOR FIRST (ev_unitary: T AND T = T;
    ev_collapse: F AND T = F) and then aggregates -> B[evaluator_conflict];
    never aggregate-then-fold'
  - 'q_amplify: c_coherent (both evaluators T) requires [phase_coherence],
    which the micro-to-macro amplification bridge loses under mode degrade ->
    status degraded, dstAggregate N[transport_loss] with support partial'
