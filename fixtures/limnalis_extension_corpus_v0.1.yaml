# Limnalis EXTENSION corpus v0.1 — PROJECT-AUTHORED (not a vendored artifact).
#
# Companion to the immutable vendored corpus fixtures/limnalis_fixture_corpus_v0.2.2.{yaml,json}.
# This file validates against the vendored fixture-corpus schema
# (schemas/limnalis_fixture_corpus_schema_v0.2.2.json) and runs through the same
# conformance machinery (load_corpus + run_case + compare_case), but its cases are
# evaluated LIVE: evaluator bindings resolve through the extension fixture pack in
# src/limnalis/plugins/fixtures.py, which keys on predicate NAMES (atom level), so
# LogicalExpr composition is computed by the runtime's spec §4 pair algebra instead
# of being echoed from claim-id-keyed expectations. The JSON twin
# limnalis_extension_corpus_v0.1.json is mechanically generated from this file
# (yaml.safe_load -> json.dump, indent=2); tests/test_extension_corpus.py enforces
# schema validity and YAML/JSON data parity.
version: v0.1
meta:
  name: Limnalis extension corpus (project-authored)
  purpose: 'Project-authored coverage extension closing the vendored corpus blind
    spots listed in spec section 17.4: logical connectives computed LIVE through
    sub-expression evaluation (atom-level fixture bindings, not claim-id keying),
    unparenthesized operator precedence per the recovered EBNF A.9, and the session
    semantics added in milestone 7 wave 2 (EvaluationSession.shared_state per
    section 16.6.3 and EvaluationStep.claim_subset per section 16.2.1), including
    the consolidated spec section 17.2 A11 narrative (test://baseline/by_context_v1,
    sessions s_shared/s_isolated) that the vendored A11 case does not pin. Cases
    C1..C4 are the Track C paradox-forensics gallery (liar, Schwarzschild,
    decoherence cat, Banach-Tarski): four bundles with deterministic live
    fixtures and pinned expectations, also mirrored as examples/paradox_*.lmn.
    TRACK LABELING CONSTRAINT: the vendored fixture-corpus schema pins
    ConformanceCase.track to the enum ["A", "B"], so all extension cases carry
    track "A" (the closest legal value: they are feature-focused cases in the
    track-A style) while their ids use the reserved "D" and "C" prefixes
    (D1..D6, C1..C4) to keep them unambiguously separate from the vendored
    A1..A14/B1..B2 cases.'
  phase_order:
  - resolve references and policies
  - resolve active frame and evaluator panel
  - initialize or reuse session baseline service
  - evaluate adequacy assessments and joint adequacy groups
  - materialize evidence views per evaluator
  - evaluate each claim per evaluator
  - synthesize support per evaluator
  - aggregate claim results under the resolution policy
  - fold blocks per evaluator, then aggregate block results
  - execute transport queries
ast_decisions:
- topic: Extension corpus track labeling under the vendored schema
  status: settled
  validation:
    track: 'vendored schema enum ["A", "B"] — track "D" is not legal, so extension
      cases use track "A" with id prefix "D"'
  notes: The vendored fixture-corpus schema (immutable) constrains ConformanceCase.track
    to the enum ["A", "B"]. Extension cases are therefore labeled track "A" — they
    are feature-pinning cases in the track-A style — and are distinguished from
    vendored cases by the "D" id prefix (D1..D6) and by this corpus file itself.
- topic: Composed-claim reasons under live sub-expression evaluation
  status: settled
  notes: 'Live LogicalExpr evaluation composes only truth values: atom-local reasons
    (e.g. source_conflict on b, undefined_term on n) do NOT propagate to the composed
    claim result. Extension expectations therefore state reasons only for leaf-level
    (whole-claim atomic) results. This differs from the vendored corpus, whose
    claim-id-keyed fixture evaluator echoes reasons for composed claims too. Under
    multi-evaluator paraconsistent_union with NO T/F conflict, a single unique
    evaluator-local reason IS inherited by the aggregate (e.g. C4 c1 aggregates
    to T with the zf evaluator''s missing_binding reason carried as disclosure).'
- topic: License reason vocabulary under live compose_license
  status: settled
  notes: 'The live runtime pins the vendored-corpus reason vocabulary, not the
    consolidated spec section 16.6.4 prose: an anchor with NO adequacy record for
    the resolved task licenses N[no_adequacy_result] (C1 l1, C4 c2), and an
    assessment whose score is declared N with no numeric method result yields
    N[missing_binding] plus an error diagnostic adequacy_method_binding_missing
    (C2 aa_core, per the vendored ast_decision "unresolved_method ->
    N[missing_binding]"). The spec-sketch spelling N[not_yet_applicable] does not
    occur in the implementation; extension expectations pin the live values.'
- topic: Assumption records have no surface-grammar form
  status: settled
  notes: 'AssumptionNode exists in the AST model and schema, but the normalizer
    has no assumption-block surface syntax (pre-existing gap, unrelated to the
    milestone 7 wave 1-2 changes). C4 therefore records the axiom of choice as
    an ACTIVE placeholder anchor (a_choice) plus a meta-stratum note claim; no
    runtime code was modified.'
- topic: Baseline reference offsets are fixed at 0
  status: settled
  notes: 'The normalizer accepts only |0:ref| baseline references; the sketched
    C2 form |inf:finite_time| is not legal surface syntax. C2 c2 pins the
    declared-unboundedness dynamic as `curvature --> divergence_within_finite_time`
    (DynamicExpr, op=approaches per the EBNF `-->` spelling) evaluated by a live
    dynamic-expression handler.'
fixtures:
- id: test://eval/atoms_v2
  type: evaluator_binding
  behavior:
    description: 'ATOM-LEVEL evaluator binding: keys on predicate NAMES, never on
      claim ids. Each zero-arity predicate leaf resolves independently, so any
      LogicalExpr over these atoms is composed by the live spec section 4
      Belnap-Dunn pair algebra (implemented in runtime._eval_logical_expr). This
      removes the vendored atoms_v1 blindness, where truths are keyed on claim
      ids and composition is never computed.'
    predicates:
      t:
        truth: T
      f:
        truth: F
      b:
        truth: B
        reason: source_conflict
      n:
        truth: N
        reason: undefined_term
    unknown_predicate:
      truth: N
      reason: undefined_term
  used_by:
  - D1
  - D2
  - D3
  - D4
  - D6
- id: test://baseline/by_context_v1
  type: baseline_source
  behavior:
    description: 'Context-sensitive baseline criterion per the consolidated spec
      section 17.2 A11 narrative. Resolves through the wave-2
      services["baseline_criterion_resolver"] path under the effective step
      context (with the baseline-local frame overlay of section 16.2.1 applied),
      so fixed-mode caching per section 16.6.3 is exercised for real: cache key
      (session_id, baseline_id) when the session has shared_state=true, and
      (session_id, step_id, baseline_id) when shared_state=false; on_reference
      baselines re-resolve at every referencing-claim evaluation.'
    contexts:
    - time: '2026-03-06T09:00:00Z'
      regime: nominal
      value: 10
    - time: '2026-03-06T09:05:00Z'
      regime: stress
      value: 20
    unmapped_context: resolution error (baseline_resolution_error diagnostic, baseline
      left unresolved)
  used_by:
  - D5
- id: test://eval/baseline_match_v1
  type: evaluator_binding
  behavior:
    description: 'Baseline-comparison evaluator per the spec section 17.2 A11
      narrative, in which sensor_A is fixed at 10. Returns T when every
      BaselineRefTerm in the claim expression resolves to a ready baseline whose
      materialized value equals the expected sensor value; F otherwise (a missing,
      non-ready, or non-matching baseline, or a claim with no baseline reference,
      all yield F).'
    expected_sensor_value: 10
  used_by:
  - D5
- id: test://paradox/eval/liar_v1
  type: evaluator_binding
  behavior:
    description: 'Liar-forensics evaluator. Predicate leaves resolve by NAME:
      the predicate "false" resolves N[undefined_term] (the liar sentence is an
      undefined term for the truth evaluator); unknown predicate names also
      resolve N[undefined_term]. JudgedExpr claims dispatch on the expression''s
      criterionRef against the live criterion pack (see
      test://paradox/criterion/tarski_gate_v1); an unregistered criterion
      resolves N[missing_binding].'
    predicates:
      'false':
        truth: N
        reason: undefined_term
  used_by:
  - C1
- id: test://paradox/criterion/tarski_gate_v1
  type: criterion_binding
  behavior:
    description: 'Tarski-gate self-reference detector for JudgedExpr claims.
      Returns B[self_reference] when any symbol argument inside the judged inner
      expression names the enclosing claim''s own id (the claim judges itself);
      otherwise returns T. Deterministic.'
  used_by:
  - C1
- id: test://paradox/eval/gr_semiclassical_v1
  type: evaluator_binding
  behavior:
    description: 'Semiclassical GR evaluator. Predicate leaves by NAME;
      DynamicExpr claims by SUBJECT symbol (declared unboundedness is
      assertable). Unknown names/subjects resolve N[undefined_term].'
    predicates:
      geodesically_incomplete:
        truth: T
      infinite_density:
        truth: T
    dynamics:
      curvature:
        truth: T
  used_by:
  - C2
- id: test://paradox/method/gw_waveforms_v1
  type: adequacy_method
  behavior:
    description: 'Executable adequacy method: recomputes 0.99, agreeing with the
      attested score (the runtime uses the attested score directly when present).'
    computes: 0.99
  used_by:
  - C2
- id: test://paradox/method/qg_tbd_v1
  type: adequacy_method
  behavior:
    description: 'Registered adequacy method that declares its score not yet
      computable (returns the non-numeric sentinel "N"). The runtime pins the
      assessment as N[missing_binding] and emits an error diagnostic
      adequacy_method_binding_missing — the missing-ness IS the verdict
      (quantum-gravity core description is open).'
    computes: 'N'
  used_by:
  - C2
- id: test://paradox/bridge/naive_extrapolation_v1
  type: bridge_binding
  behavior:
    description: 'Degrade-mode bridge carrier for the semiclassical-to-core
      extrapolation. The runtime''s builtin execute_transport implements degrade
      internally (spec section 10.2 default degradation: T -> N[transport_loss],
      support partial); the via URI is carried in provenance and registered in
      the live pack as a marker only.'
  used_by:
  - C2
- id: test://paradox/eval/unitary_v1
  type: evaluator_binding
  behavior:
    description: Unitary-dynamics evaluator for the decoherence-cat panel.
    predicates:
      superposed:
        truth: T
      interference_pattern:
        truth: T
  used_by:
  - C3
- id: test://paradox/eval/collapse_v1
  type: evaluator_binding
  behavior:
    description: Collapse-postulate evaluator for the decoherence-cat panel.
    predicates:
      superposed:
        truth: F
      interference_pattern:
        truth: T
  used_by:
  - C3
- id: test://paradox/bridge/amplification_v1
  type: bridge_binding
  behavior:
    description: 'Degrade-mode micro-to-macro amplification bridge losing
      phase_coherence. Builtin degrade semantics apply (T ->
      N[transport_loss], support partial); via URI registered as a marker.'
  used_by:
  - C3
- id: test://paradox/eval/zfc_v1
  type: evaluator_binding
  behavior:
    description: 'ZFC-frame evaluator: the duplication theorem holds
      (duplicable(sphere)=T) and contradicts naive volume preservation
      (volume_preserved(sphere)=F).'
    predicates:
      duplicable:
        truth: T
      volume_preserved:
        truth: F
  used_by:
  - C4
- id: test://paradox/eval/zf_v1
  type: evaluator_binding
  behavior:
    description: 'ZF-frame evaluator (no axiom of choice), REGISTERED in the
      live pack but deterministically undecided on choice-dependent predicates:
      duplicable and volume_preserved resolve N[missing_binding] (no binding
      without AC). Unknown predicate names resolve N[undefined_term].'
    predicates:
      duplicable:
        truth: N
        reason: missing_binding
      volume_preserved:
        truth: N
        reason: missing_binding
  used_by:
  - C4
- id: test://paradox/method/lebesgue_measure_v1
  type: adequacy_method
  behavior:
    description: 'Executable adequacy method: recomputes 0.98, agreeing with
      the attested score.'
    computes: 0.98
  used_by:
  - C4
cases:
- track: A
  id: D1
  name: Live conjunction over mixed atoms
  focus:
  - live_logical_composition
  - atom_level_bindings
  - pair_algebra_conjunction
  - B_and_N_equals_F
  source: |-
    bundle D1_live_conjunction {
      frame {
        system Test;
        namespace Logic;
        scale unit;
        task check;
        regime nominal;
      }

      evaluator ev0 {
        kind model;
        binding test://eval/atoms_v2;
      }

      resolution_policy rp0 {
        kind single;
        members [ev0];
      }

      local {
        c1: (b AND n);
        c2: (t AND b);
        c3: (t AND n);
        c4: (f OR n);
      }
    }
  environment: {}
  normalized_ast_expectations:
  - t, f, b, n in expression position -> zero-arity PredicateExprNode
  - c1..c4 -> LogicalExprNode; truths computed LIVE by the spec section 4 pair algebra
    over atoms_v2 leaf results, not echoed from claim-id-keyed expectations
  - 'expected values from the spec section 4 tables: B AND N = F (flagship), T AND
    B = B, T AND N = N, F OR N = N'
  - composed results carry no reason (atom-local reasons do not propagate through
    live composition)
  expected:
    sessions:
    - id: default
      steps:
      - id: step0
        claims:
          c1:
            per_evaluator:
              ev0:
                truth: F
                support: absent
            aggregate:
              truth: F
              support: absent
          c2:
            per_evaluator:
              ev0:
                truth: B
                support: absent
            aggregate:
              truth: B
              support: absent
          c3:
            per_evaluator:
              ev0:
                truth: N
                support: absent
            aggregate:
              truth: N
              support: absent
          c4:
            per_evaluator:
              ev0:
                truth: N
                support: absent
            aggregate:
              truth: N
              support: absent
        blocks:
          local:
            per_evaluator:
              ev0: F
            aggregate: F
            claimIds:
            - c1
            - c2
            - c3
            - c4
    diagnostics: []
- track: A
  id: D2
  name: Live disjunction and negation
  focus:
  - live_logical_composition
  - pair_algebra_disjunction
  - pair_algebra_negation
  - B_or_N_equals_T
  source: |-
    bundle D2_live_disjunction_negation {
      frame {
        system Test;
        namespace Logic;
        scale unit;
        task check;
        regime nominal;
      }

      evaluator ev0 {
        kind model;
        binding test://eval/atoms_v2;
      }

      resolution_policy rp0 {
        kind single;
        members [ev0];
      }

      local {
        c1: (b OR n);
        c2: (NOT b);
        c3: (NOT n);
      }
    }
  environment: {}
  normalized_ast_expectations:
  - c1 -> LogicalExprNode(op=or); c2, c3 -> LogicalExprNode(op=not) with a single
    argument
  - 'expected values from the spec section 4 tables: B OR N = T, NOT B = B, NOT N
    = N (negation swaps the pair bits; B and N are fixed points)'
  - 'block fold over live results T, B, N hits the B-and-N-present rule: block(local)
    = F'
  expected:
    sessions:
    - id: default
      steps:
      - id: step0
        claims:
          c1:
            per_evaluator:
              ev0:
                truth: T
                support: absent
            aggregate:
              truth: T
              support: absent
          c2:
            per_evaluator:
              ev0:
                truth: B
                support: absent
            aggregate:
              truth: B
              support: absent
          c3:
            per_evaluator:
              ev0:
                truth: N
                support: absent
            aggregate:
              truth: N
              support: absent
        blocks:
          local:
            per_evaluator:
              ev0: F
            aggregate: F
            claimIds:
            - c1
            - c2
            - c3
    diagnostics: []
- track: A
  id: D3
  name: Derived connectives with canonical spellings
  focus:
  - live_logical_composition
  - derived_connectives
  - canonical_operator_spellings
  source: |-
    bundle D3_derived_connectives {
      frame {
        system Test;
        namespace Logic;
        scale unit;
        task check;
        regime nominal;
      }

      evaluator ev0 {
        kind model;
        binding test://eval/atoms_v2;
      }

      resolution_policy rp0 {
        kind single;
        members [ev0];
      }

      local {
        c1: (b -> n);
        c2: (b <=> n);
      }
    }
  environment: {}
  normalized_ast_expectations:
  - 'the canonical EBNF operator spellings are pinned in source: "->" (ImplOp) ->
    LogicalExprNode(op=implies); "<=>" (IffOp) -> LogicalExprNode(op=iff)'
  - 'expected values from the spec section 4 derivations: B -> N = (NOT B) OR N =
    B OR N = T; B <=> N = (B -> N) AND (N -> B) = T AND T = T'
  expected:
    sessions:
    - id: default
      steps:
      - id: step0
        claims:
          c1:
            per_evaluator:
              ev0:
                truth: T
                support: absent
            aggregate:
              truth: T
              support: absent
          c2:
            per_evaluator:
              ev0:
                truth: T
                support: absent
            aggregate:
              truth: T
              support: absent
        blocks:
          local:
            per_evaluator:
              ev0: T
            aggregate: T
            claimIds:
            - c1
            - c2
    diagnostics: []
- track: A
  id: D4
  name: Unparenthesized operator precedence
  focus:
  - unparenthesized_precedence
  - ebnf_a9_operator_binding
  - live_logical_composition
  source: |-
    bundle D4_unparenthesized_precedence {
      frame {
        system Test;
        namespace Logic;
        scale unit;
        task check;
        regime nominal;
      }

      evaluator ev0 {
        kind model;
        binding test://eval/atoms_v2;
      }

      resolution_policy rp0 {
        kind single;
        members [ev0];
      }

      local {
        c1: t AND f OR t;
        c2: f AND t OR t;
        c3: n OR t AND b;
      }
    }
  environment: {}
  normalized_ast_expectations:
  - 'EBNF A.9 binding tightest-to-loosest is NOT > AND > OR > IMPLIES > IFF; the
    first-match split order is loosest-first, so OR splits before AND'
  - c1 -> or(and(t, f), t); computes OR(AND(T,F),T) = OR(F,T) = T. Pins the tree
    shape; the inverted tree and(t, or(f, t)) happens to compute T as well, so c2/c3
    carry the truth-level discrimination
  - c2 -> or(and(f, t), t) = OR(F,T) = T; the inverted-precedence tree and(f, or(t,
    t)) would compute F, so a precedence regression is detectable by truth alone
  - c3 -> or(n, and(t, b)) = OR(N,B) = T; the inverted-precedence tree and(or(n,
    t), b) would compute B, a second truth-level discriminator that also exercises
    the pair algebra on B/N atoms
  expected:
    sessions:
    - id: default
      steps:
      - id: step0
        claims:
          c1:
            per_evaluator:
              ev0:
                truth: T
                support: absent
            aggregate:
              truth: T
              support: absent
          c2:
            per_evaluator:
              ev0:
                truth: T
                support: absent
            aggregate:
              truth: T
              support: absent
          c3:
            per_evaluator:
              ev0:
                truth: T
                support: absent
            aggregate:
              truth: T
              support: absent
        blocks:
          local:
            per_evaluator:
              ev0: T
            aggregate: T
            claimIds:
            - c1
            - c2
            - c3
    diagnostics: []
- track: A
  id: D5
  name: Shared vs isolated session baseline state (spec A11 narrative)
  focus:
  - session_evaluation
  - shared_state
  - fixed_vs_on_reference
  - context_sensitive_baseline
  source: |-
    bundle D5_session_shared_state {
      frame {
        system Test;
        namespace Baseline;
        scale service;
        task compare;
        regime nominal;
      }

      evaluator ev0 {
        kind model;
        binding test://eval/baseline_match_v1;
      }

      resolution_policy rp0 {
        kind single;
        members [ev0];
      }

      baseline b_fixed {
        kind point;
        criterion ref test://baseline/by_context_v1;
        frame @{system=Test, namespace=Baseline};
        evaluation_mode fixed;
      }

      baseline b_step {
        kind point;
        criterion ref test://baseline/by_context_v1;
        frame @{system=Test, namespace=Baseline};
        evaluation_mode on_reference;
      }

      local {
        c_fixed: matches_baseline(sensor_A, |0:b_fixed|);
        c_step: matches_baseline(sensor_A, |0:b_step|);
      }
    }
  environment:
    sessions:
    - id: s_shared
      shared_state: true
      steps:
      - id: s1
        time:
          kind: point
          t: '2026-03-06T09:00:00Z'
        frame_override:
          node: FramePattern
          facets:
            regime: nominal
      - id: s2
        time:
          kind: point
          t: '2026-03-06T09:05:00Z'
        frame_override:
          node: FramePattern
          facets:
            regime: stress
    - id: s_isolated
      shared_state: false
      steps:
      - id: s1
        time:
          kind: point
          t: '2026-03-06T09:00:00Z'
        frame_override:
          node: FramePattern
          facets:
            regime: nominal
      - id: s2
        time:
          kind: point
          t: '2026-03-06T09:05:00Z'
        frame_override:
          node: FramePattern
          facets:
            regime: stress
  normalized_ast_expectations:
  - '|0:b_fixed|, |0:b_step| -> BaselineRefTermNode inside PredicateExprNode args'
  - baseline frames deliberately omit the regime facet so the baseline-local frame
    overlay (section 16.2.1) does not mask the step frame_override regime that
    by_context_v1 dispatches on
  - 'section 16.6.3 cache semantics: fixed-mode cache key is (session_id, baseline_id)
    under shared_state=true and (session_id, step_id, baseline_id) under
    shared_state=false; on_reference re-resolves at every referencing-claim
    evaluation'
  - 'spec section 17.2 A11 narrative values: s_shared s2 sees b_fixed=10 (cached)
    and b_step=20 (re-resolved); s_isolated s2 sees b_fixed=20 (re-initialized)
    and b_step=20'
  expected:
    baseline_states:
      b_fixed: ready
      b_step: ready
    sessions:
    - id: s_shared
      steps:
      - id: s1
        claims:
          c_fixed:
            per_evaluator:
              ev0:
                truth: T
                support: absent
            aggregate:
              truth: T
              support: absent
          c_step:
            per_evaluator:
              ev0:
                truth: T
                support: absent
            aggregate:
              truth: T
              support: absent
        blocks:
          local:
            per_evaluator:
              ev0: T
            aggregate: T
      - id: s2
        claims:
          c_fixed:
            per_evaluator:
              ev0:
                truth: T
                support: absent
            aggregate:
              truth: T
              support: absent
          c_step:
            per_evaluator:
              ev0:
                truth: F
                support: absent
            aggregate:
              truth: F
              support: absent
        blocks:
          local:
            per_evaluator:
              ev0: F
            aggregate: F
    - id: s_isolated
      steps:
      - id: s1
        claims:
          c_fixed:
            per_evaluator:
              ev0:
                truth: T
                support: absent
            aggregate:
              truth: T
              support: absent
          c_step:
            per_evaluator:
              ev0:
                truth: T
                support: absent
            aggregate:
              truth: T
              support: absent
        blocks:
          local:
            per_evaluator:
              ev0: T
            aggregate: T
      - id: s2
        claims:
          c_fixed:
            per_evaluator:
              ev0:
                truth: F
                support: absent
            aggregate:
              truth: F
              support: absent
          c_step:
            per_evaluator:
              ev0:
                truth: F
                support: absent
            aggregate:
              truth: F
              support: absent
        blocks:
          local:
            per_evaluator:
              ev0: F
            aggregate: F
    diagnostics: []
- track: A
  id: D6
  name: Step claim_subset restriction
  focus:
  - claim_subset
  - session_evaluation
  - block_folding_under_restriction
  source: |-
    bundle D6_claim_subset {
      frame {
