            per_evaluator:
              ev_unitary:
                truth: T
                support: absent
              ev_collapse:
                truth: F
                support: absent
            aggregate:
              truth: B
              reason: evaluator_conflict
              support: conflicted
          c_coherent:
            per_evaluator:
              ev_unitary:
                truth: T
                support: absent
              ev_collapse:
                truth: T
                support: absent
            aggregate:
              truth: T
              support: absent
        blocks:
          local:
            per_evaluator:
              ev_unitary: T
              ev_collapse: F
            aggregate: B
            claimIds:
            - c_super
            - c_coherent
        transports:
          q_amplify:
            status: degraded
            sourceAggregate:
              truth: T
              support: absent
            dstAggregate:
              truth: N
              reason: transport_loss
              support: partial
