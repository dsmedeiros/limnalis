- track: A
  id: C1
  name: Liar paradox forensics
  focus:
  - paradox_gallery
  - meta_stratum
  - note_exclusion
  - judged_expr
  - self_reference
  - N_and_B_equals_F
  source: |-
    bundle C1_liar_forensics {
      frame {
        system Language;
        namespace TarskianSemantics;
        scale sentence;
        task truth_assignment;
        regime classical;
      }

      evaluator ev_meta {
        kind model;
        binding test://paradox/eval/liar_v1;
      }

      resolution_policy rp0 {
        kind single;
        members [ev_meta];
      }

      anchor a_liar_truth {
        term symbol liar_sentence_truth;
        subtype placeholder;
        status active;
      }

      meta {
        l0: note "The liar sentence -- this sentence is false. Notation-layer artifact; recorded, not evaluated.";
        l1: false(liar_sentence) uses [a_liar_truth];
        l3: refers_to_itself(l3) judged_by test://paradox/criterion/tarski_gate_v1;
      }
    }
  environment: {}
  normalized_ast_expectations:
  - l0 -> NoteExprNode, non-evaluable; excluded from block folding and carried
    without pinned expectations (note claims are omitted from expected claims
    per the vendored convention)
  - l1 -> PredicateExprNode(name=false); the liar sentence is an undefined term
    for the live truth evaluator -> N[undefined_term]
  - 'l1 license: a_liar_truth is an active placeholder anchor with ZERO adequacy
    assessments, so live compose_license pins N[no_adequacy_result] (the
    implementation''s reason vocabulary; the spec-sketch spelling
    not_yet_applicable does not occur — see ast_decisions). No runtime lint-13
    diagnostic exists; lint rules live in the analyzer, not the conformance
    runtime.'
  - l3 -> JudgedExprNode(criterionRef=test://paradox/criterion/tarski_gate_v1)
    wrapping refers_to_itself(l3); the criterion detects the claim-id
    self-reference -> B[self_reference]
  - 'block(meta) folds the evaluable set {l1=N, l3=B} -> F: the flagship
    B-and-N-present rule firing through live per-evaluator folding'
  expected:
    sessions:
    - id: default
      steps:
      - id: step0
        claims:
          l1:
            per_evaluator:
              ev_meta:
                truth: N
                reason: undefined_term
                support: absent
            aggregate:
              truth: N
              reason: undefined_term
              support: absent
            license:
              overall:
                truth: N
                reason: no_adequacy_result
              individual:
                'a_liar_truth:truth_assignment':
                  truth: N
                  reason: no_adequacy_result
          l3:
            per_evaluator:
              ev_meta:
                truth: B
                reason: self_reference
                support: absent
            aggregate:
              truth: B
              reason: self_reference
              support: absent
        blocks:
          meta:
            per_evaluator:
              ev_meta: F
            aggregate: F
            claimIds:
            - l0
            - l1
            - l3
    diagnostics: []
- track: A
  id: C2
  name: Schwarzschild singularity forensics
  focus:
  - paradox_gallery
  - adequacy_assessment
  - score_not_computable
  - dynamic_expr
  - degrade_transport
  - transport_loss
  source: |-
    bundle C2_schwarzschild_forensics {
      frame {
        system Spacetime;
        namespace SchwarzschildGR;
        scale global;
        task prediction;
        regime exterior_vacuum;
      }

      evaluator ev_gr {
        kind model;
        binding test://paradox/eval/gr_semiclassical_v1;
      }

      resolution_policy rp0 {
        kind single;
        members [ev_gr];
      }

      anchor a_smooth_manifold {
        term symbol smooth_lorentzian_manifold;
        subtype idealization;
        status active;

        adequacy {
          id aa_pred;
          task prediction;
          producer gw_observatory;
          score 0.99;
          threshold 0.95;
          method test://paradox/method/gw_waveforms_v1;
        }

        adequacy {
          id aa_core;
          task description;
          producer qg_program;
          score N;
          threshold 0.90;
          method test://paradox/method/qg_tbd_v1;
        }
      }

      bridge b_to_core {
        from @{system=Spacetime, namespace=SchwarzschildGR, scale=global, task=prediction};
        to @{system=Spacetime, namespace=QuantumGravity, scale=planck, task=description, regime=singular};
        via test://paradox/bridge/naive_extrapolation_v1;
        preserve [causal_structure];
        lose [semiclassical_validity];
        transport {
          mode degrade;
        }
      }

      local {
        c1: geodesically_incomplete(interior_geodesics) uses [a_smooth_manifold];
        c2: curvature --> divergence_within_finite_time;
        c3: infinite_density(r_zero) requires [semiclassical_validity] uses [a_smooth_manifold] annotations {"license_task": "description"};
      }
    }
  environment:
    transport_queries:
    - id: q_core
      claimId: c3
      bridgeId: b_to_core
  normalized_ast_expectations:
  - 'c1 licensed under the frame task (prediction): aa_pred attests 0.99 >= 0.95
    with a registered, agreeing method -> anchor:prediction adequacy T ->
    license T'
  - 'c2 -> DynamicExprNode(op=approaches, subject=curvature): the sketched
    |inf:finite_time| target is not legal surface syntax (baseline refs are
    fixed at offset 0), so declared unboundedness is pinned as the symbol
    target divergence_within_finite_time, evaluated T by the live
    dynamic-expression handler'
  - 'c3 annotated license_task=description: aa_core declares score N and its
    registered method qg_tbd_v1 returns the non-numeric sentinel, so the live
    runtime pins adequacy N[missing_binding] plus the error diagnostic
    adequacy_method_binding_missing (vendored ast_decision unresolved_method ->
    N[missing_binding]; the spec-sketch spelling not_yet_applicable does not
    occur) -> license N[missing_binding]'
  - 'q_core: c3 requires [semiclassical_validity], bridge b_to_core loses it
    under mode degrade -> status degraded, dstAggregate N[transport_loss] with
    support partial (spec section 10.2 default degradation, computed by the
    builtin execute_transport)'
  expected:
    sessions:
    - id: default
      steps:
      - id: step0
        claims:
          c1:
            per_evaluator:
              ev_gr:
                truth: T
                support: absent
            aggregate:
              truth: T
              support: absent
            license:
              overall:
                truth: T
              individual:
                'a_smooth_manifold:prediction':
                  truth: T
          c2:
            per_evaluator:
              ev_gr:
                truth: T
                support: absent
            aggregate:
              truth: T
              support: absent
          c3:
            per_evaluator:
              ev_gr:
                truth: T
                support: absent
            aggregate:
              truth: T
              support: absent
            license:
              overall:
                truth: N
                reason: missing_binding
              individual:
                'a_smooth_manifold:description':
                  truth: N
                  reason: missing_binding
        blocks:
          local:
            per_evaluator:
              ev_gr: T
            aggregate: T
            claimIds:
            - c1
            - c2
            - c3
        transports:
          q_core:
            status: degraded
            sourceAggregate:
              truth: T
              support: absent
            dstAggregate:
              truth: N
              reason: transport_loss
              support: partial
    adequacy_expectations:
      aa_pred:
        truth: T
      aa_core:
        truth: N
        reason: missing_binding
      'a_smooth_manifold:prediction':
        truth: T
      'a_smooth_manifold:description':
        truth: N
        reason: missing_binding
    diagnostics:
    - severity: error
      subject: aa_core
      code: adequacy_method_binding_missing
